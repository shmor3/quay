# GitHub Actions CI for hotreload

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Build
        run: cargo build --manifest-path watcher/Cargo.toml
      - name: Test
        run: cargo test --manifest-path watcher/Cargo.toml
      - name: Lint (Clippy)
        run: cargo clippy --manifest-path watcher/Cargo.toml -- -D warnings
      - name: Format
        run: cargo fmt -- --check
