[package]
name = "hotreload-watcher"
version = "0.2.0"
edition = "2021"
description = "A minimal, language-agnostic file watcher that runs commands on changes and broadcasts reload/CSS-inject messages to browser clients via WebSocket."
license = "MIT"
readme = "README.md"

[dependencies]
notify = "6.1"
tokio = { version = "1.36", features = ["full"] }
tokio-tungstenite = "0.20"
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
base64 = "0.22"
serde_json = "1.0"
clap = { version = "4.3", features = ["derive"] }
globset = "0.4"
serde_yaml = "0.9"
serde = { version = "1.0", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "2"
similar = "2.6"
prometheus = "0.13"

[[bin]]
name = "watchd"
path = "src/main.rs"
